name: Release

on:
  push:
    tags: ['v*']
  # Manual run pushes an image tagged `canary` and skips the GitHub Release,
  # so the publish path can be verified without cutting a version.
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build
        run: mvn -B verify -DskipTests
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --generate-notes --title "$TAG" target/sitemap-studio-*.jar

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Resolve image tags
        id: meta
        env:
          REF: ${{ github.ref }}
        run: |
          case "$REF" in
            refs/tags/v*) version="${REF#refs/tags/v}" ;;
            *) version=canary ;;
          esac
          tags="ghcr.io/${GITHUB_REPOSITORY}:${version}"
          if [ "$version" != canary ]; then
            tags="$tags,ghcr.io/${GITHUB_REPOSITORY}:latest"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
      - name: Summary
        run: |
          echo "Published \`${{ steps.meta.outputs.tags }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Verify: \`docker pull ghcr.io/${GITHUB_REPOSITORY}:${{ steps.meta.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"

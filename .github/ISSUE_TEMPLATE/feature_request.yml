name: Feature request
description: Suggest an idea or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem this feature would solve
      description: What is hard or impossible today? Concrete scenarios beat vague wishes.
      placeholder: As a … I want to … because …
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How should it work? Include UI flow, endpoints, or config keys if you have ideas.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other ways to solve the same problem, and why they are worse.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Crawl / sitemap generation
        - SEO report / export
        - Auto-update / push (SFTP/FTP/FTPS/IndexNow)
        - Auth / account isolation
        - UI / i18n
        - Build / deployment
        - Other

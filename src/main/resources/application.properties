# ÃÂÃÂ¦ÃÂÃÂÃÂÃÂÃÂÃÂ¥ÃÂÃÂÃÂÃÂ¡ÃÂÃÂ¥ÃÂÃÂÃÂÃÂ¨ÃÂÃÂ©ÃÂÃÂÃÂÃÂÃÂÃÂ§ÃÂÃÂ½ÃÂÃÂ®
server.port=8080
server.servlet.context-path=/
# 仅用 Cookie 传会话，避免重定向地址出现 ;jsessionid
server.servlet.session.tracking-modes=cookie

# ÃÂÃÂ¥ÃÂÃÂºÃÂÃÂÃÂÃÂ§ÃÂÃÂÃÂÃÂ¨ÃÂÃÂ©ÃÂÃÂÃÂÃÂÃÂÃÂ§ÃÂÃÂ½ÃÂÃÂ®
spring.application.name=sitemap-generator

# ThymeleafÃÂÃÂ©ÃÂÃÂÃÂÃÂÃÂÃÂ§ÃÂÃÂ½ÃÂÃÂ®
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.servlet.content-type=text/html
spring.thymeleaf.cache=false

# MessageSource must not fall back to host system language: root bundle is the zh baseline
spring.messages.fallback-to-system-locale=false

# ÃÂÃÂ¦ÃÂÃÂÃÂÃÂ¥ÃÂÃÂ¥ÃÂÃÂ¿ÃÂÃÂÃÂÃÂ©ÃÂÃÂÃÂÃÂÃÂÃÂ§ÃÂÃÂ½ÃÂÃÂ®
logging.level.io.github.ghgongjin.sitemap=INFO
logging.level.org.springframework.web=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# ÃÂÃÂ§ÃÂÃÂ«ÃÂÃÂÃÂÃÂ§ÃÂÃÂÃÂÃÂ¹ÃÂÃÂ¥ÃÂÃÂÃÂÃÂ°ÃÂÃÂ¥ÃÂÃÂÃÂÃÂ¾ÃÂÃÂ§ÃÂÃÂÃÂÃÂÃÂÃÂ¦ÃÂÃÂÃÂÃÂÃÂÃÂ¥ÃÂÃÂÃÂÃÂ¨ÃÂÃÂ©ÃÂÃÂÃÂÃÂÃÂÃÂ§ÃÂÃÂ½ÃÂÃÂ®
sitemap.generator.max-depth=10
sitemap.generator.max-pages=1000
sitemap.generator.timeout-ms=30000
sitemap.generator.max-threads=20
sitemap.generator.user-agent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36

# ÃÂÃÂ¥ÃÂÃÂ¼ÃÂÃÂÃÂÃÂ¥ÃÂÃÂÃÂÃÂÃÂÃÂ¥ÃÂÃÂ·ÃÂÃÂ¥ÃÂÃÂ¥ÃÂÃÂÃÂÃÂ·
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

# Playwright Headless Browser 配置（用于 JS 动态页面渲染）
sitemap.generator.renderer.enabled=false
sitemap.generator.renderer.pool-size=2
sitemap.generator.renderer.timeout-seconds=15
sitemap.generator.renderer.spa-threshold=50

# 代理池配置（用于爬虫代理轮换）
# 代理列表格式：host:port 或 host:port:username:password（多个代理用逗号分隔）
sitemap.generator.proxy.enabled=false
sitemap.generator.proxy.list=
# 健康检查间隔（毫秒）
sitemap.generator.proxy.health-check-interval-ms=60000
# 健康检查超时（毫秒）
sitemap.generator.proxy.health-check-timeout-ms=5000

# H2 文件数据库（自动更新站点与 SEO 报告持久化）
spring.datasource.url=jdbc:h2:file:./data/sitemapdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Auto update scheduler
sitemap.auto-update.enabled=true
sitemap.auto-update.scan-interval-ms=60000
sitemap.auto-update.initial-delay-ms=30000

# 推送凭据加密密钥（Base64 编码的 32 字节；留空时自动读取或生成 data/push.key）
sitemap.push.crypto-key=${SITEMAP_PUSH_KEY:}
sitemap.push.key-file=./data/push.key

# Diff & notification (feature A). spring.mail.* intentionally unset: without a host the
# MailSender bean is not created and notifications are webhook-only.
sitemap.notify.enabled=true
sitemap.notify.webhook-timeout-ms=10000
sitemap.notify.allow-private-network=true
sitemap.notify.max-emails-per-site-per-day=50
